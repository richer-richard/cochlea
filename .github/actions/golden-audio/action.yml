name: 'cochlea golden-audio'
description: >
  Fail the build when generated audio regresses against a checked-in golden
  set, using cochlea's deterministic feature-space diff. No human ear, no
  flaky byte comparison — a Tier-2 feature-equivalence gate (or exact
  byte-identity).
inputs:
  candidates:
    description: 'Directory of candidate audio files (model/render outputs).'
    required: true
  references:
    description: 'Directory of reference (golden) audio files, matched by filename.'
    required: true
  tier:
    description: "'tier2' (feature-equivalent, the default) or 'exact' (byte-identical)."
    required: false
    default: 'tier2'
  json:
    description: 'Optional path to write the JSON eval report.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: cochlea eval
      shell: bash
      # Inputs reach the script through the environment, never through
      # `${{ }}` interpolation into the script text. Interpolation pastes the
      # value in before bash parses the line, so an input containing a quote
      # and `$(…)` would run as a command; an env var is only ever data. The
      # caller's own workflow supplies these, but this action is meant to be
      # copied, and a consumer who wires an input to `github.event.*` data
      # would otherwise hand that data a shell.
      env:
        COCHLEA_CANDIDATES: ${{ inputs.candidates }}
        COCHLEA_REFERENCES: ${{ inputs.references }}
        COCHLEA_TIER: ${{ inputs.tier }}
        COCHLEA_JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail
        args=(eval --candidates "$COCHLEA_CANDIDATES" --references "$COCHLEA_REFERENCES")
        if [ "$COCHLEA_TIER" = "exact" ]; then args+=(--exact); fi
        if [ -n "$COCHLEA_JSON" ]; then args+=(--json "$COCHLEA_JSON"); fi
        # Prefer a `cochlea` already on PATH (e.g. installed from crates.io);
        # fall back to building it from this checkout.
        if command -v cochlea >/dev/null 2>&1; then
          cochlea "${args[@]}"
        else
          cargo run --quiet -p cochlea -- "${args[@]}"
        fi
