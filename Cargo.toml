[workspace]
resolver = "3"
members = [
    "crates/score",
    "crates/synth",
    "crates/render",
    "crates/features",
    "crates/spectro",
    "crates/verify",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/richer-richard/cochlea"
keywords = ["audio", "dsp", "synthesis", "deterministic", "headless"]
categories = ["multimedia::audio"]

# No crate in this workspace uses unsafe code; keep it that way. Denormal
# policy is "honor them" (docs/determinism.md), so nothing here ever needs
# to touch FPU control registers.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
cochlea-score = { version = "0.1.0", path = "crates/score" }
cochlea-synth = { version = "0.1.0", path = "crates/synth" }
cochlea-render = { version = "0.1.0", path = "crates/render" }
cochlea-features = { version = "0.1.0", path = "crates/features" }
cochlea-spectro = { version = "0.1.0", path = "crates/spectro" }
cochlea-verify = { version = "0.1.0", path = "crates/verify" }

# Resolved on crates.io 2026-07-03 (never pinned from memory).
#
# fundsp: default features off — `files` pulls symphonia and `fft` pulls
# fft-convolver, neither of which we use (our FFT is rustfft, in features/
# spectro only).
fenestra-anim = { version = "0.1.0", features = ["serde"] }
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }
libm = "0.2.16"
ebur128 = "0.1.10"
rustfft = "6.4.1"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ron = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rayon = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
anyhow = "1.0.103"
proptest = "1.11"
