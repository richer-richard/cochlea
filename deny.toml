# cargo-deny config. The [bans] list is the *dependency direction law* made
# structural: nothing in this workspace may depend on GUI, GPU, or realtime
# audio-device crates, ever (docs/plan.md). CI fails if one appears anywhere in
# the resolved graph.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # GPU
    { crate = "wgpu", reason = "dependency direction law: no GPU crates" },
    { crate = "vello", reason = "dependency direction law: no GPU crates" },
    { crate = "ash", reason = "dependency direction law: no GPU crates" },
    { crate = "vulkano", reason = "dependency direction law: no GPU crates" },
    { crate = "metal", reason = "dependency direction law: no GPU crates" },
    { crate = "glow", reason = "dependency direction law: no GPU crates" },
    { crate = "glutin", reason = "dependency direction law: no GPU crates" },
    # GUI / windowing
    { crate = "winit", reason = "dependency direction law: no GUI crates" },
    { crate = "egui", reason = "dependency direction law: no GUI crates" },
    { crate = "eframe", reason = "dependency direction law: no GUI crates" },
    { crate = "gtk", reason = "dependency direction law: no GUI crates" },
    { crate = "sdl2", reason = "dependency direction law: no GUI crates" },
    { crate = "minifb", reason = "dependency direction law: no GUI crates" },
    { crate = "softbuffer", reason = "dependency direction law: no GUI crates" },
    # Realtime audio devices (offline only; invariant 4)
    { crate = "cpal", reason = "offline only: no audio device crates" },
    { crate = "rodio", reason = "offline only: no audio device crates" },
    { crate = "jack", reason = "offline only: no audio device crates" },
    { crate = "coreaudio-rs", reason = "offline only: no audio device crates" },
    { crate = "portaudio", reason = "offline only: no audio device crates" },
    # Planned for phase 2, deliberately absent from v1: remove the ban in the
    # PR that introduces the feature, not before.
    { crate = "rustysynth", reason = "sampled instruments (SF2) are phase 2" },
]

[advisories]
yanked = "deny"
