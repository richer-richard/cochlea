# Python bindings crate. Deliberately DETACHED from the main cochlea
# workspace (its own empty [workspace] table below) so that pyo3 and the
# Python toolchain never enter the determinism-critical core build or its CI
# (`cargo test --workspace`, `cargo deny`). The core stays pure Rust; this is
# the reach layer, built separately with maturin.
[package]
name = "cochlea-py"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
description = "Python bindings for cochlea: deterministic audio probe/diff/render/assert"

[workspace]

[lib]
name = "_cochlea"
crate-type = ["cdylib"]

[dependencies]
cochlea-features = { path = "../../crates/features" }
cochlea-render = { path = "../../crates/render" }
cochlea-score = { path = "../../crates/score" }
cochlea-spectro = { path = "../../crates/spectro" }
cochlea-decode = { path = "../../crates/decode" }
# serde/serde_json versions match the main workspace (resolved on crates.io
# 2026-07-03 / -07-09); pyo3 is added via `cargo add` at build time so its
# version is resolved on crates.io, never pinned from memory.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }
