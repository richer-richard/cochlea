# Audio decode into the analysis pipeline's `Audio` type: WAV via hound,
# FLAC/mp3/ogg-vorbis via symphonia (pure Rust, MPL-2.0 — no ffmpeg, no
# system codecs). Depends on cochlea-features only for `Audio` itself;
# never on score/synth, so `cochlea probe some.mp3` stays score-free like
# the rest of the read path. Two contracts: WAV/FLAC decode bit-exact (FLAC
# is lossless by spec, so nothing weakens the determinism contract); mp3/
# ogg are analysis input only — reproducible per build, no exactness claim.
[package]
name = "cochlea-decode"
description = "Audio decode (WAV/FLAC bit-exact; mp3/ogg for analysis) for the cochlea pipeline"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cochlea-features.workspace = true
# For the WAV header peek in `load_wav`: a compressed decompression bomb is
# caught mid-decode, but an oversized *uncompressed* WAV is cheaper to refuse
# from its declared data-chunk length before any samples are read. hound is
# already the WAV reader under `cochlea_features::Audio::from_wav`; this is a
# direct, header-only use of the same crate.
hound.workspace = true
symphonia.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only for the #[ignore]d fixture-regeneration test (hound writes the WAV
# twin, libm supplies the sine — clippy's disallowed-methods ban on std
# transcendentals applies to test code too).
hound.workspace = true
libm.workspace = true

[lints]
workspace = true
